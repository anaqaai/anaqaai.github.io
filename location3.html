<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Toys - Our Location</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background: linear-gradient(to bottom, #f8f9fa, #e0f7fa); }
        .navbar { background: linear-gradient(135deg, #ff6b6b, #4ecdc4) !important; }
        #map { height: 400px; border-radius: 15px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index3.html"><i class="fas fa-cube me-2"></i>ABC Toys</a>
            <!-- Navbar links same as before -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index3.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products3.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link active" href="location3.html">Location</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact3.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="extra3.html">WURFL</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <h1 class="text-center mb-4">Your Current Location</h1>
        <div class="card shadow mb-4">
            <div class="card-body text-center">
                <p id="status" class="lead">Detecting location...</p>
                <p id="coords" class="fs-4 fw-bold text-primary"></p>
            </div>
        </div>
        
        <div id="map"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, marker;
        
        function showPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            document.getElementById('coords').innerHTML = `
                Latitude: <span class="text-success">${lat.toFixed(6)}</span><br>
                Longitude: <span class="text-success">${lon.toFixed(6)}</span>
            `;
            document.getElementById('status').textContent = "📍 You are here!";

            if (!map) {
                map = L.map('map').setView([lat, lon], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);
            } else {
                map.setView([lat, lon], 15);
            }

            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lon]).addTo(map)
                .bindPopup("<b>You are here!</b>")
                .openPopup();
        }

        function showError(error) {
            let msg = "Location error: ";
            switch(error.code) {
                case error.PERMISSION_DENIED: msg += "Permission denied"; break;
                case error.POSITION_UNAVAILABLE: msg += "Location unavailable"; break;
                case error.TIMEOUT: msg += "Request timeout"; break;
            }
            document.getElementById('status').innerHTML = `<span class="text-danger">${msg}</span>`;
        }

        // Auto geolocation
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(showPosition, showError, { enableHighAccuracy: true });
        } else {
            document.getElementById('status').innerHTML = `<span class="text-danger">Geolocation not supported</span>`;
        }
    </script>
</body>
</html>
